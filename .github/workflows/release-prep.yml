# Optional multi-target release builds with the same path hygiene as local freeze.
# Manual only: do not auto-build on tag push (avoids unclean Actions artifacts).
# Does not publish crates or flip repo visibility.
name: release-prep

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.1
          targets: ${{ matrix.target }}
      - name: Build release CLI (remapped + stripped)
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          set -euo pipefail
          REPO="${{ github.workspace }}"
          export RUSTFLAGS="--remap-path-prefix=${REPO}=/src/beavermath --remap-path-prefix=${HOME}/.cargo=/cargo -C strip=symbols -C debuginfo=0"
          cargo build --locked --release -p beavermath-cli --target ${{ matrix.target }}
      - name: Path hygiene strings scan
        run: |
          set -euo pipefail
          BIN=target/${{ matrix.target }}/release/beavermath
          if [ -f "${BIN}.exe" ]; then BIN="${BIN}.exe"; fi
          if [ ! -f "$BIN" ]; then echo "missing binary"; exit 1; fi
          if strings "$BIN" | grep -E '/Users/|Desktop/beavermath|/home/runner/work/beavermath' ; then
            echo "path leak in binary"
            exit 1
          fi
          echo "strings scan clean"
      - name: Checksum
        run: |
          BIN=target/${{ matrix.target }}/release/beavermath
          if [ -f "$BIN" ]; then
            shasum -a 256 "$BIN" | tee beavermath-${{ matrix.target }}.sha256
          elif [ -f "${BIN}.exe" ]; then
            shasum -a 256 "${BIN}.exe" | tee beavermath-${{ matrix.target }}.sha256
          fi
      - uses: actions/upload-artifact@v6
        with:
          name: beavermath-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/beavermath
            target/${{ matrix.target }}/release/beavermath.exe
            beavermath-*.sha256
          if-no-files-found: warn
