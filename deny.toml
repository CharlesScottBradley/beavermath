# cargo-deny configuration for BeaverMath 0.1.0 release
# https://embarkstudios.github.io/cargo-deny/

[graph]
targets = []
all-features = false
no-default-features = false

[advisories]
version = 2
yanked = "warn"
# Transitive via ratex-render / ratex-unicode-font (RaTeX 0.1.13). No safe upgrade yet.
# Track: https://rustsec.org/advisories/RUSTSEC-2026-0192
ignore = [
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser unmaintained; pulled by RaTeX font stack; replace when ratex migrates to skrifa" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
